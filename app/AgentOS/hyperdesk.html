<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyperDesk</title>
<link rel="icon" href="/assets/hyperdesk.svg" type="image/svg+xml">
<meta name="theme-color" content="#050505">
<style>
@font-face { font-family: "IBM Plex Sans"; src: url(/assets/fonts/IBMPlexSans.woff2) format("woff2"); font-weight: 100 700; font-display: swap }
@font-face { font-family: "IBM Plex Mono"; src: url(/assets/fonts/IBMPlexMono-400.woff2) format("woff2"); font-weight: 400; font-display: swap }
@font-face { font-family: "IBM Plex Mono"; src: url(/assets/fonts/IBMPlexMono-500.woff2) format("woff2"); font-weight: 500; font-display: swap }
@font-face { font-family: Oxanium; src: url(/assets/fonts/Oxanium.woff2) format("woff2"); font-weight: 200 800; font-display: swap }
:root {
  /* the SILVADES brand system (silvades.com): void black, one neon, Oxanium for display, Plex Mono for labels */
  --bg: #050505; --side: #0a0a0a; --raise: #121212; --raise2: #1a1a1a; --line: #222; --line2: #333;
  --text: #e0e0e0; --muted: #9a9a9a; --faint: #858585;  /* faint: 4.7:1 on --raise2, the darkest it may go for small text */
  --accent: #39ff14; --accent2: #2bcc10; --glow: 0 0 20px #39ff1440; --ink: #050505; --warn: #f2b84b; --bad: #ff6b6b; --ok: var(--accent);
  --sans: "IBM Plex Sans", "Segoe UI", sans-serif; --mono: "IBM Plex Mono", Consolas, monospace; --disp: Oxanium, var(--sans);
  --r: 4px; --col: 780px; --ease: .14s ease;
  color-scheme: dark; font-family: var(--sans);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line2) transparent }
::selection { background: var(--accent); color: var(--ink) }
[hidden] { display: none !important }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased }
body { display: grid; grid-template-columns: 264px 1fr; height: 100vh; overflow: hidden; transition: grid-template-columns .18s ease }
body.folded { grid-template-columns: 0 1fr }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; border-radius: 3px }
button, input, select, textarea { transition: background-color var(--ease), color var(--ease), border-color var(--ease), box-shadow var(--ease) }
button:disabled { opacity: .4; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input, select, textarea { font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; min-width: 0 }
input:focus, select:focus, textarea:focus { outline: none; border-color: #39ff1480 }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none }
.grow { flex: 1 } .muted { color: var(--muted) } .faint { color: var(--faint) } .small { font-size: 12.5px } .mono { font-family: var(--mono); font-size: 12.5px }
.ok { color: var(--ok) } .warn { color: var(--warn) } .bad { color: var(--bad) }
/* eyebrow labels, as on the site: small mono caps, tracked out */
.label, .menu .hd, th, .meta, .acts button:not(.btn), .where, .tag { font: 500 10.5px/1.4 var(--mono); letter-spacing: 1.5px; text-transform: uppercase }

/* sidebar */
#side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden }
body.folded #side { border: 0; visibility: hidden }  /* out of the Tab order too, not only 0 px wide */
.sidehead { display: flex; align-items: center; gap: 9px; padding: 20px 12px 20px 16px }
.sidehead img { width: 22px; height: 22px }
.wordmark { font: 700 14px/1 var(--disp); letter-spacing: 3px; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 20px #39ff144d; white-space: nowrap }
.row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 7px 10px; border-radius: 3px; text-align: left; color: var(--muted); white-space: nowrap }
.row:hover { background: var(--raise); color: var(--text) }
.row.on { background: var(--raise2); color: var(--text); box-shadow: inset 2px 0 var(--accent) }
.row .k { margin-left: auto; font: 10.5px var(--mono); color: var(--faint) }
.row .n { margin-left: auto; font: 600 10.5px/1.6 var(--mono); background: var(--warn); color: var(--ink); border-radius: 2px; padding: 0 6px }
.sidebody { overflow-y: auto; padding: 0 8px; flex: 1 }
.newrow { color: var(--text); margin: 2px 0 6px }
.label { color: var(--muted); padding: 22px 10px 6px; font-size: 10px }
.thread { position: relative }
.thread .row { padding-right: 30px }
.thread .row span { overflow: hidden; text-overflow: ellipsis }
.thread .del { position: absolute; right: 4px; top: 5px; width: 26px; height: 26px; display: grid; opacity: 0; place-items: center; color: var(--faint) }
.thread:hover .del, .thread .del:focus-visible { opacity: 1 } .thread .del:hover { color: var(--bad); background: var(--raise2) }
.busydot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); flex: none; animation: blink 1.2s infinite }
@keyframes blink { 50% { opacity: .25 } }
.sidefoot { border-top: 1px solid var(--line); padding: 8px }

/* main */
/* column 2 always: on a narrow window the open sidebar is position: fixed, and main would otherwise take its 0 px column */
main { grid-column: 2; display: flex; flex-direction: column; min-width: 0; height: 100vh; position: relative; background: radial-gradient(1100px 420px at 50% 120%, #39ff1412, transparent 62%) }
.top { height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 14px; flex: none; border-bottom: 1px solid var(--line); margin-bottom: 8px }
.top .title { font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50vw; flex-shrink: 1000 }  /* gives way before any notice */
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); flex: none }
/* notices give way before the status pill and full-screen button do: a long one is clipped, never pushed off-screen */
#attn { display: flex; gap: 4px; min-width: 0; overflow: hidden; padding: 4px; margin: -4px }  /* room for the focus ring inside the clip */ #attn .pill { flex: 0 1 auto; min-width: 0; overflow: hidden }
.iconbtn:hover { background: var(--raise); color: var(--text) }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; color: var(--muted); font: 500 11.5px/1.4 var(--mono); flex: none; white-space: nowrap }
.pill:hover { background: var(--raise); color: var(--text) }
.pill.attn { color: var(--warn); background: #f2b84b14; box-shadow: inset 0 0 0 1px #f2b84b40 }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px #39ff1480; flex: none }
.dot.warn { background: var(--warn) } .dot.bad { background: var(--bad) } .dot.off { background: var(--faint) }
.dot.warn, .dot.bad, .dot.off { box-shadow: none }
#scroll { flex: 1; overflow-y: auto }
.col { max-width: var(--col); margin: 0 auto; padding: 8px 24px 0 }

/* empty state: #view takes the scroll area's height so the greeting and composer sit centred, as designed */
#view:has(> .hello) { height: 100% }
.hello { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-bottom: 12vh }
.hello h1 { font: 600 34px/1.15 var(--disp); letter-spacing: 1px; margin: 0 0 10px }
.hello h1 em { font-style: normal; color: var(--accent); text-shadow: var(--glow) }
.hello p { margin: 0 0 22px; color: var(--muted) }
.brief { margin-top: 18px; display: flex; flex-direction: column; gap: 2px }
.brief button { display: flex; gap: 10px; align-items: baseline; text-align: left; padding: 5px 8px; color: var(--muted); font-size: 13px }
.brief button:hover { background: var(--raise); color: var(--text) }
.brief .dot { transform: translateY(-1px); width: 6px; height: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px }
.chips button { border: 1px solid var(--line); padding: 7px 12px; color: var(--muted); font-size: 13px }
.chips button:hover { border-color: var(--accent2); color: var(--text) }

/* conversation */
.turn { padding: 18px 0 6px; animation: rise .22s ease both }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } }
.you { display: flex; justify-content: flex-end; margin-bottom: 14px }
.you div { background: var(--raise); border: 1px solid var(--line); border-right: 2px solid var(--accent); padding: 10px 15px; border-radius: var(--r); max-width: 82%; white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.55 }
.job { margin: 0 0 18px }
.meta { display: flex; align-items: center; gap: 7px; color: var(--faint); margin-bottom: 8px }
.meta b { font-weight: 500; color: var(--muted) }
.job.live .meta b { color: var(--accent) }
.meta .why { cursor: help; border-bottom: 1px dotted var(--line2) }
.md { font-size: 15px; line-height: 1.7; word-break: break-word }
.md p { margin: 0 0 12px } .md p:last-child { margin-bottom: 0 }
.md h3 { font: 600 16px/1.3 var(--disp); letter-spacing: .5px; margin: 20px 0 8px }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px } .md li { margin: 3px 0 } .md li::marker { color: var(--accent) }
.md code { font-family: var(--mono); font-size: 13px; background: var(--raise2); padding: 1px 5px; border-radius: 3px }
.md pre { background: var(--side); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; overflow: auto; margin: 0 0 12px }
.md pre code { background: none; padding: 0; font-size: 12.8px; line-height: 1.55 }
.md a, .page a { color: var(--text); text-decoration: underline; text-decoration-color: #39ff1466; text-underline-offset: 3px; cursor: pointer; transition: text-decoration-color var(--ease) }
.md a:hover, .page a:hover { text-decoration-color: var(--accent) }
.md .cite { color: var(--accent); font-size: 11px; vertical-align: super; font-family: var(--mono) }
.host { color: var(--faint); font-size: 12px }
.thinking { color: var(--faint); font-size: 14px }
.thinking::after { content: "…"; color: var(--accent); animation: blink 1.2s infinite }
.sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px }
.sources button { border: 1px solid var(--line); padding: 4px 9px; font-size: 12px; color: var(--muted); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sources button:hover { color: var(--text); border-color: var(--accent2) }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px }
.imgs img { width: 100%; border-radius: var(--r); display: block; cursor: zoom-in; background: var(--raise); transition: box-shadow var(--ease) }
.imgs img:hover { box-shadow: 0 0 0 1px var(--accent2) }
.log { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--side); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; white-space: pre-wrap; max-height: 220px; overflow: auto }
.acts { display: flex; gap: 2px; margin-top: 6px; opacity: 0; transition: opacity .12s }
.job:hover .acts, .acts:focus-within, .job.live .acts { opacity: 1 }
.acts button:not(.btn) { color: var(--faint); padding: 5px 8px }
.acts button:not(.btn):hover { color: var(--accent); background: var(--raise) }
.err { color: var(--bad); font-size: 13.5px }

/* composer */
.dock { flex: none; padding: 6px 24px 14px }
.composer { max-width: var(--col); margin: 0 auto; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 12px 12px 8px 16px; box-shadow: 0 10px 30px #000a; transition: border-color var(--ease) }
.composer:focus-within { border-color: #39ff1480 }
.composer textarea { width: 100%; background: none; border: 0; padding: 2px 0 6px; resize: none; font-size: 15.5px; line-height: 1.5; max-height: 40vh }
.cbar { display: flex; align-items: center; gap: 4px }
.where { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; color: var(--muted) }
.where:hover { background: var(--raise2); color: var(--accent) }
.preview { font-size: 12.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 6px }
.preview b { color: var(--muted); font-weight: 500 }
.send { width: 34px; height: 34px; background: var(--accent); color: var(--ink); display: grid; place-items: center; box-shadow: var(--glow) }
.send:hover:not(:disabled) { background: var(--accent2); box-shadow: 0 0 30px #39ff1466 }
.send:disabled { background: var(--raise2); color: var(--faint); opacity: 1; box-shadow: none }
.send svg.i { stroke-width: 2.2 }
.mic { width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted) }
.mic:hover { background: var(--raise2); color: var(--text) }
.mic.rec { color: var(--bad); animation: blink 1s infinite } .mic.busy { color: var(--accent); animation: blink 1s infinite }
.fine { max-width: var(--col); margin: 8px auto 0; text-align: center; font: 10.5px/1.4 var(--mono); letter-spacing: .3px; color: var(--faint) }
.composer.drop { border-color: var(--accent); border-style: dashed }
.att { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px } .att:empty { display: none }
.youfiles { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-bottom: 6px }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 260px; padding: 4px 6px 4px 9px; border: 1px solid var(--line2); border-radius: 3px; font-size: 12.5px; color: var(--muted); background: var(--raise2) }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip button { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 2px; color: var(--faint) }
.chip button:hover { color: var(--text); background: var(--line) }

/* menus and popovers */
.menu { position: fixed; z-index: 50; background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r); padding: 6px; min-width: 240px; max-width: 340px; max-height: 70vh; overflow: auto; box-shadow: 0 16px 40px #000c; display: none }
.menu.open { display: block; animation: pop .12s ease }
@keyframes pop { from { opacity: 0; transform: translateY(4px) } }
@keyframes fade { from { opacity: 0 } }
.menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; text-align: left; border-radius: 2px; font-size: 13.5px }
.menu .mi:hover { background: var(--raise2) }
.menu .mi small { margin-left: auto; color: var(--faint); font-size: 11.5px }
.menu .sep { height: 1px; background: var(--line); margin: 6px 4px }
.menu .hd { color: var(--faint); padding: 8px 10px 4px }
.menu .tick { width: 14px; color: var(--accent) }
.menu .block { padding: 6px 10px; font-size: 13px }

/* pages behind the menu */
.page { max-width: 1220px; margin: 0 auto; padding: 20px 32px 60px }
.page h1 { font: 700 28px/1.2 var(--disp); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 8px }
.page h2 { font: 500 11px/1.4 var(--mono); letter-spacing: 2.2px; text-transform: uppercase; color: var(--accent); margin: 30px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px }
.page .sub { color: var(--muted); margin: 0 0 14px; max-width: 760px }
.btn { border: 1px solid var(--line2); border-radius: 3px; padding: 5px 12px; font: 600 11.5px/1.6 var(--disp); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); background: var(--raise); white-space: nowrap }
.btn:hover { border-color: var(--accent2); color: var(--accent) }
.btn.go { background: var(--accent); color: var(--ink); border-color: var(--accent); box-shadow: var(--glow) }
.btn.go:hover { background: var(--accent2); border-color: var(--accent2); color: var(--ink); box-shadow: 0 0 30px #39ff1466 }
.btn.danger { color: var(--bad) } .btn.danger:hover { border-color: var(--bad) }
.btn.quiet { border-color: transparent; background: none; color: var(--muted) } .btn.quiet:hover { color: var(--accent); background: var(--raise) }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px }
.seg { display: inline-flex; background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 2px }
.seg button { padding: 4px 11px; font: 500 10.5px/1.6 var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); border-radius: 2px }
.seg button:hover { color: var(--text) }
.seg button.on { background: var(--raise2); color: var(--accent) }
.switch { position: relative; width: 44px; height: 24px; flex: none; border-radius: 12px; background: var(--raise2); box-shadow: inset 0 0 0 1px var(--line); transition: background .15s }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s }
.switch.on { background: #39ff1426; box-shadow: inset 0 0 0 1px var(--accent) }
.switch.on::after { transform: translateX(20px); background: var(--accent) }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.meter { height: 8px; border-radius: 4px; background: var(--raise2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; margin: 6px 0 4px }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .6s }
.meter.idle > i { background: var(--faint) } .meter.due > i { background: var(--warn) }
.meterrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted) }
.meterrow b { color: var(--text); font-weight: 500 }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }
.steps span { font: 500 10.5px/1.6 var(--mono); letter-spacing: 1px; text-transform: uppercase; padding: 1px 7px; border-radius: 2px; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line) }
.steps span.done { color: var(--ok); box-shadow: inset 0 0 0 1px #39ff1440 }
.steps span.now { color: var(--ink); background: var(--accent); animation: pulse 1.2s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .55 } }
@media (prefers-reduced-motion: reduce) { .steps span.now { animation: none } .meter > i { transition: none } }
table { width: 100%; border-collapse: collapse }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13.5px }
th { color: var(--faint); font-size: 10.5px }
tr.click { cursor: pointer } tr.click:hover td { background: var(--raise) }
td.clip { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.list .item { display: flex; gap: 14px; align-items: center; padding: 11px 8px; border-bottom: 1px solid var(--line); transition: background-color var(--ease) }
.list .item:hover { background: var(--side) }
.list .item .t { font-weight: 500 } .list .item .s { color: var(--faint); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.list .item .acts2 { display: flex; gap: 4px; opacity: .55; transition: opacity .12s } .list .item:hover .acts2, .list .item .acts2:focus-within { opacity: 1 }
.tag { color: var(--muted); border: 1px solid var(--line); border-radius: 2px; padding: 1px 7px; white-space: nowrap }
.tag.ok { color: var(--ok); border-color: #39ff1440 } .tag.warn { color: var(--warn); border-color: #f2b84b40 } .tag.bad { color: var(--bad); border-color: #ff6b6b40 }
pre.box { background: var(--side); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow: auto; margin: 0; max-height: 360px; color: var(--muted) }
.thumbs { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) }
.thumbs button { padding: 0; aspect-ratio: 1; overflow: hidden; border-radius: 3px; background: var(--raise) }
.thumbs button:hover { box-shadow: 0 0 0 1px var(--accent2) }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block }
.form { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; align-items: center }
details > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 6px 0 }
details > summary:hover { color: var(--text) }

/* dialogs, toasts */
.overlay { position: fixed; inset: 0; background: #000c; display: none; align-items: flex-start; justify-content: center; padding-top: 10vh; z-index: 60 }
.overlay.open { display: flex; animation: fade .12s ease }
.overlay.open .dialog { animation: pop .14s ease }
.dialog { background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r); width: min(760px, 92vw); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px #000c }
.dialog .dh { padding: 14px 18px; font: 600 15px/1.3 var(--disp); letter-spacing: .5px; display: flex; align-items: center; gap: 10px }
.dialog .db { padding: 0 18px 14px; overflow: auto } .dialog .df { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center }
#approve .dialog { border-color: #f2b84b66 }
#approve .what { font-size: 18px; font-weight: 500; color: var(--warn); margin: 6px 0 12px }
#pal .dialog { width: min(620px, 92vw) }
#pal input { width: 100%; font-size: 15px; padding: 15px 18px; border: 0; border-bottom: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; background: none }
#pal .list { overflow: auto; padding: 6px }
#pal .it { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 2px; cursor: pointer; font-size: 13.5px }
#pal .it.on { background: var(--raise2); box-shadow: inset 2px 0 var(--accent) } #pal .it span:last-child { color: var(--faint); font: 10.5px/1.9 var(--mono); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap }
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 70; align-items: center; pointer-events: none }

    for (const l of p.split("\n")) { const k = kind(l); if (k !== "h" && groups.at(-1)?.k === k) groups.at(-1).ls.push(l); else groups.push({k, ls: [l]}); }
    return groups.map(({k, ls}) => k === "h" ? `<h3>${ls[0].replace(/^#+ /, "")}</h3>` : k === "p" ? `<p>${ls.join("<br>")}</p>`
      : `<${k}${k === "ol" ? ` start="${parseInt(ls[0])}"` : ""}>${ls.map(l => `<li>${l.replace(/^\s*(?:[-*•]|\d+[.)]) /, "")}</li>`).join("")}</${k}>`).join("");
  }).join("");
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    // a link always shows where it goes; one level of brackets in it (Wikipedia's "Python_(language)") belongs to it
    .replace(/\[([^\]\n]+)\]\((https?:\/\/(?:[^()\s]|\([^()\s]*\))+)\)/g, (_, text, url) => {
      // undo esc() for the two a valid address can hold; a raw " < > is never one, so none reaches Edge's command line
      const u = url.replace(/&amp;/g, "&").replace(/&#39;/g, "'");
      blocks.push(`<a${attrs({do: "browser.open", name: "Edge", url: u})} title="${esc(u)}">${text}</a><span class="host"> (${esc(host(u))})</span>`);
      return `\u0000${blocks.length - 1}\u0000`;  // set aside: the citation pass below must not reach into its attributes
    })
    .replace(/\[(\d{1,2})\]/g, '<span class="cite">[$1]</span>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

let prefer = "auto", previewTimer = null, previewSeq = 0;

async function preview() {

  const seq = ++previewSeq;
  try {
    const items = await api("plan", {text, prefer, files: attached, thread: page ? undefined : thread || undefined});
    if (seq !== previewSeq || ask.value.trim() !== text) return;  // a newer preview (new text or new picker) won
    $("#preview").innerHTML = "→ " + items.map(i => `<b>${esc(KIND[i.kind])}</b>${ROUTE(i) ? " · " + esc(ROUTE(i)) : ""}`).join("  +  ");
    $("#preview").title = items.map(i => i.why).join("\n");

}

async function send(text, into = page ? "" : thread) {  // from a page, a message starts a new conversation

    else if (r.thread !== thread || page) await openThread(r.thread);

}

let shownApproval = "";
function renderApproval() {
  const ap = S?.approvals?.[0], box = $("#approve");
  if (!ap) { box.classList.remove("open"); shownApproval = ""; return; }
  const left = Math.max(0, 300 - Math.round((Date.now() - Date.parse(ap.at.replace(" ", "T"))) / 1000));
  if (ap.id !== shownApproval) {
    shownApproval = ap.id;
    $("#ab").innerHTML = `<p class="muted small" style="margin-top:0">Working on “${esc(ap.task || "a research question")}”. It wants to:</p><div class="what">${esc(ap.what)}</div>
      <p class="small muted">The browser is a fresh, empty profile, signed in nowhere. Say no to anything that sends personal data, signs in, buys or posts.</p>
      <details><summary>Exact request</summary><pre class="box">${esc(ap.tool)}\n${esc(JSON.stringify(ap.input, null, 2))}</pre></details>`;
    $("#af").innerHTML = `<span class="small faint grow" id="acount"></span>${btn("Refuse", {js: "approve", id: ap.id, allow: "no"}, "btn danger")}${btn("Allow once", {js: "approve", id: ap.id, allow: "yes"}, "btn go")}`;

// ---------- console for the one-at-a-time maintenance commands (update, smoke, bench, merge, roll back): System page
let logOff = 0, logActive = false, lastCmd, logText = "";
function startLog() { logOff = 0; logText = ""; logActive = true; }  // each Runner command truncates the log file
async function pollLog() {
  if (!logActive) return;
  const since = logOff, r = await api("log?since=" + since).catch(() => null);
  if (!r || since !== logOff) return;  // another poll or a new run moved the offset: this chunk is stale or a duplicate
  logText += r.text.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "");
  logOff = r.next;
  const box = $("#clog");
  if (box) { const end = box._lost || box.scrollTop + box.clientHeight >= box.scrollHeight - 8; box.textContent = logText || "No command has run yet."; if (end) box.scrollTop = box.scrollHeight; box._lost = !box.clientHeight; }
  if (!r.command.running && !r.text) {
    logActive = false;
    if (r.command.title) toast(`${r.command.title}: ${r.command.exit === 0 ? "done" : "exit " + r.command.exit}`, r.command.exit !== 0);
    if (["tasks", "system", "video", "analytics", "sites"].includes(page)) VIEWS[page].render();
    if (thread && !page) { rendered = {}; loadThread(); }  // a merge or roll back changes what a task's card offers
  }
}

let rec = null;  // null, "starting", or the running MediaRecorder
const toBase64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
async function toggleMic(d, el) {
  if (rec === "starting") return;
  if (rec) { rec.stop(); return; }
  rec = "starting";
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch { rec = null; return toast("The microphone is blocked. Allow it for HyperDesk (the icon at the left of the title bar), then try again.", true); }
  api("action", {do: "voice.warm"}).catch(() => {});
  const chunks = [], recorder = new MediaRecorder(stream);
  rec = recorder; el.classList.add("rec");
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    rec = null; stream.getTracks().forEach(t => t.stop()); el.classList.replace("rec", "busy");
    try {
      const r = await api("transcribe", {audio: await toBase64(new Blob(chunks, {type: recorder.mimeType}))});
      const box = $(d.target);
      if (!r.text) toast("Heard nothing. Try again a little closer to the mic.", true);
      else if (box) { box.value = (box.value.trim() ? box.value.trimEnd() + " " : "") + r.text; box.focus(); box.dispatchEvent(new Event("input")); }
      else toast(`You said: ${r.text}`);
    } catch (e) { toast(e.message, true); }
    el.classList.remove("busy");
  };
  recorder.start();
}
function stopMic() { if (rec && rec !== "starting") rec.stop(); }

      const when = d => new Date(d).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"});
      let bar = "";
      if (t.exists && !t.enabled) bar = `<div class="meter idle" role="img" aria-label="Automatic sync paused"><i style="width:100%"></i></div><div class="meterrow"><span>${last ? `Last sync <b>${span(now - last)} ago</b>` : "No sync yet"}</span><span>Paused: no automatic syncs</span></div>`;
      else if (t.exists && next && last) {
        const due = now >= next, f = due ? 1 : Math.min(1, Math.max(0, (now - last) / (next - last)));
        bar = `<div class="meter ${due ? "due" : ""}" role="progressbar" aria-label="Time until the next sync" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(f * 100)}"><i style="width:${(f * 100).toFixed(1)}%"></i></div>
          <div class="meterrow"><span>Last sync <b>${span(now - last)} ago</b></span><span>${due ? "Next sync is due: it runs as soon as the PC is awake" : `Next sync in <b>${span(next - now)}</b> · ${when(next)}`}</span></div>`;
      }
      put($("#anext"), bar);
      const steps = ["youtube", "ga4", "meta", "tiktok", "squarespace", "dashboard"];
      const syncing = S?.command?.running && S.command.title === "analytics sync";
      const done = steps.filter(s => new RegExp(`^(sync )?${s}:`, "m").test(logText)).length;
      put($("#aprog"), syncing ? `<div class="meter" role="progressbar" aria-label="Sync progress" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${done}"><i style="width:${Math.max(4, done / steps.length * 100)}%"></i></div>
        <div class="meterrow"><span>Syncing <b>${done} of ${steps.length}</b></span><span>${steps[done] ? "now: " + steps[done] : "finishing"}</span></div>
        <div class="steps">${steps.map((s, i) => `<span class="${i < done ? "done" : i === done ? "now" : ""}">${s}</span>`).join("")}</div>` : "");
    },
  },

    src: "all", metric: "tokens",
    async usage(refresh) {
      try {
        this.u = await api("usage" + (refresh ? "?refresh=1" : ""));
        this.draw();
      } catch (e) { $("#ulist") && ($("#ulist").innerHTML = `<p class="bad">${esc(e.message)}</p>`); }
    },
    draw() {
      const u = this.u, el = $("#ulist");
      if (!u || !el) return;
      const usd = v => v ? "$" + v.toFixed(2) : "", full = n => (n || 0).toLocaleString();
      const srcs = this.src === "all" ? ["claude", "codex"] : [this.src];
      const PARTS = [["Output", "var(--accent)"], ["Input", "#7ad7ff"], ["Cache write", "var(--warn)"], ["Cache read", "#666"]];  // server order
      const rows = u.days.map(([d, x]) => {
        const p = [0, 0, 0, 0];
        srcs.forEach(s => (x[s + "_parts"] || []).forEach((v, i) => p[i] += v));
        return {d, x, p, tok: srcs.reduce((a, s) => a + (x[s] || 0), 0), usd: srcs.reduce((a, s) => a + (x[s + "_usd"] || 0), 0)};
      });
      const sum = f => rows.reduce((a, r) => a + f(r), 0);
      const tot = sum(r => r.tok), out = sum(r => r.p[0]), cr = sum(r => r.p[3]), cost = sum(r => r.usd);
      const peak = rows.reduce((a, r) => r.tok > a.tok ? r : a, {tok: 0, d: "–"});
      const val = r => this.metric === "tokens" ? r.tok : this.metric === "output" ? r.p[0] : r.usd;
      const fmtv = v => this.metric === "cost" ? usd(v) : num(v);

      }).join("");
      const models = (u.models || []).filter(m => srcs.includes(m[1])), mtot = models.reduce((a, m) => a + m[2], 0);

      el.innerHTML = `<div class="bar"><span class="seg">${seg("src", "all", "All")}${seg("src", "claude", "Claude Code")}${seg("src", "codex", "Codex")}</span><span class="grow"></span><span class="seg">${seg("metric", "tokens", "Tokens")}${seg("metric", "output", "Output")}${seg("metric", "cost", "API-rate $")}</span></div>

          <div class="metric" title="${full(ptot)} tokens"><span class="name">Claude Code, all time</span><strong>${num(ptot)}</strong><small>${u.projects.length} projects</small></div>
          <div class="metric" title="${full(tot)} tokens"><span class="name">Tokens, 14 days</span><strong>${num(tot)}</strong><small>peak ${esc(peak.d.slice(5))}: ${num(peak.tok)}</small></div>
          <div class="metric" title="${full(out)} tokens"><span class="name">Output written</span><strong>${num(out)}</strong><small>${num(out / Math.max(1, rows.length))} per active day</small></div>
          <div class="metric" title="${full(cr)} tokens"><span class="name">Cache reads</span><strong>${tot ? (100 * cr / tot).toFixed(1) : 0}%</strong><small>${num(cr)} re-read context, billed cheap</small></div>
          <div class="metric"><span class="name">API-rate est.</span><strong>${usd(cost) || "$0"}</strong><small>usage on subscriptions, not a charge</small></div>
        </div>
        <div class="ubars">${chart}</div>
        ${this.metric === "tokens" ? `<div class="ulegend">${PARTS.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>` : ""}
        <table><tr><th>Day</th><th>Tokens</th><th>Output</th><th>Input</th><th>Cache write</th><th>Cache read</th><th>API-rate est.</th><th title="calls: local / free / cloud">Agent OS calls</th></tr>
          ${rows.map(r => `<tr><td style="white-space:nowrap">${esc(r.d)}</td><td title="${full(r.tok)}"><b>${r.tok ? num(r.tok) : ""}</b></td>${r.p.map(n => `<td class="small" title="${full(n)}">${n ? num(n) : ""}</td>`).join("")}<td class="faint">${usd(r.usd)}</td><td class="small faint">${r.x.os_local || r.x.os_free || r.x.os_cloud ? [r.x.os_local, r.x.os_free, r.x.os_cloud].map(n => n || 0).join(" / ") : ""}</td></tr>`).join("")}</table>

        if ($("#simp")) $("#simp").innerHTML = !imp.at ? '<p class="muted">Not run yet.</p>' : (imp.found.length ? `<div class="list">${imp.found.map((f, i) => `<div class="item"><div class="grow"><div class="t">${esc(f.what)}</div><div class="s" style="white-space:pre-wrap">${esc(f.evidence)}</div></div>${f.task ? `<div class="acts2" style="opacity:1">${btn("Fix", {do: "improve.fix", i, at: imp.at, confirm: `Hand this to Agent OS? One task on Agent OS itself, built and tested by free and local AI (no paid AI); it ends at your merge.\n\n${f.task}`})}</div>` : ""}</div>`).join("")}</div>` : '<p class="muted">Nothing to improve this week.</p>') + `<p class="small faint">Checked ${esc(imp.at)}</p>`;
        $("#sman").innerHTML = s.manifest.length ? `<h2>Installed by Agent OS</h2><table><tr><th>Component</th><th>Version</th><th>Since</th><th>Uninstall</th></tr>${s.manifest.map(m => `<tr><td>${esc(m.component)}</td><td class="small">${esc(m.version)}</td><td class="small">${esc(m.date)}</td><td class="mono small faint">${esc(m.uninstall)}</td></tr>`).join("")}</table>` : "";
      }).catch(e => toast(e.message, true));
    },
    live() {
      if (!S || !$("#shealth")) return;
      const h = S.health;
      put($("#shealth"), (h.running ? '<p class="muted">Checking…</p>' : "") + (h.results.length ? `<table><tr><th>Check</th><th>Status</th><th>Detail</th><th>Fix</th></tr>${h.results.map(([n, st, d, f]) => `<tr><td>${esc(n)}</td><td class="${{PASS: "ok", WARN: "warn", FAIL: "bad"}[st] || ""}">${esc(String(st).toLowerCase())}</td><td class="small">${esc(d)}</td><td class="small faint">${esc(f)}</td></tr>`).join("")}</table><p class="small faint">Checked ${esc(h.at)}</p>` : h.running ? "" : '<p class="muted">Not checked yet: press Run checks.</p>'));
    },
  },
};

// one image job at a time from the Images page; its progress lives here so returning to the page shows it
const imageJob = {running: false, html: ""};
const showJob = html => { imageJob.html = html; if ($("#ijob")) $("#ijob").innerHTML = html; };
async function generate() {
  if (imageJob.running) return;
  const f = VIEWS.images.form;
  Object.assign(f, {prompt: $("#iprompt").value.trim(), negative: $("#ineg").value, steps: +$("#isteps").value, cfg: +$("#icfg").value, count: +$("#icount").value, seed: $("#iseed").value.trim(), free: $("#ifree").checked});
  if (!f.prompt) return toast("Describe the image first.", true);
  if (!S?.services?.ComfyUI) return toast("ComfyUI is not running. Start it from the status menu, or just ask “draw …” in a conversation (that starts it).", true);
  imageJob.running = true; if ($("#igo")) $("#igo").disabled = true;
  const start = Date.now(), secs = () => Math.round((Date.now() - start) / 1000);
  try {
    const job = await api("image", {prompt: f.prompt, negative: f.negative, size: f.size, steps: f.steps, cfg: f.cfg, count: f.count, seed: f.seed, free_vram: f.free});
    for (let missing = 0; ; ) {
      await sleep(1500);
      const st = await api("image/status?id=" + job.id);
      missing = st.state === "starting" ? missing + 1 : 0;
      if (missing > 20 || secs() > 1800) throw new Error("ComfyUI no longer has this job (cancelled, or ComfyUI restarted).");
      showJob(`<p class="muted small">${st.done ? "Done" : esc(st.state)} · ${secs()} s · seed ${esc(job.seed)}</p>`);
      if (!st.done) continue;
      if (st.error) throw new Error(st.error);
      showJob(`<p class="muted small">${secs()} s · seed ${esc(job.seed)}</p><div class="imgs">${st.files.map(n => `<img alt="${esc(f.prompt)}" data-js="zoom" data-name="${esc(n)}" src="/api/image/file?name=${encodeURIComponent(n)}&t=${T}">`).join("")}</div>`);
      if (page === "images") VIEWS.images.gallery();
      break;
    }
  } catch (e) { toast(e.message, true); showJob(""); }
  imageJob.running = false; if ($("#igo")) $("#igo").disabled = false;
}

// ---------- tasks: the form (pop-up), inspect
function taskForm(text = "", repo = "") {
  const repos = cache.repos;
  if (!repos.length) return `<p class="muted">No git repo in ${esc(S?.workspace || "the workspace folder")} yet. Put one there (git clone or git init) and come back.</p>`;
  return `<div class="form"><label for="mtext">What to do</label><textarea id="mtext" rows="3" placeholder="e.g. Fix the expired-session bug in auth.py">${esc(text)}</textarea>
    <label for="mrepo">Repo</label><select id="mrepo">${repos.map(r => `<option ${r === repo ? "selected" : ""}>${esc(r)}</option>`).join("")}</select>
    <label for="magent">Agent</label><select id="magent"><option value="">as configured (${esc(S?.implementer || "")} implements)</option><option>opencode</option><option>claude</option><option>codex</option></select>
    <label for="mlevel">Level</label><select id="mlevel"><option value="">auto</option><option value="0">0 · evidence only, no model</option><option value="1">1 · a local model answers</option><option value="2">2 · one agent changes code</option><option value="3">3 · plan first, then implement</option></select></div>`;
}
async function newTask(text = "", repo = "") {
  if (!cache.tasks) await loadTasks().catch(() => {});
  modal("New Agent OS task", taskForm(text, repo), cache.repos.length ? `${btn("Cancel", {js: "close"}, "btn quiet")}${btn("Run task", {js: "taskrun"}, "btn go")}` : btn("Close", {js: "close"}));
  $("#mtext")?.focus();
}
async function runTask() {
  const task = $("#mtext")?.value.trim();
  if (!task) return toast("Describe the task first.", true);
  if (await act({do: "run", task, repo: $("#mrepo").value, agent: $("#magent").value, level: $("#mlevel").value})) closeModal();
}
function modal(title, body, foot) {
  $("#mh").textContent = title; $("#mb").innerHTML = body; $("#mf").innerHTML = foot ?? btn("Close", {js: "close"});
  $("#modal").classList.add("open");
}
function closeModal() { stopMic(); $("#modal").classList.remove("open"); }
async function inspect(id) {
  modal(`Task ${id}`, '<p class="muted">Reading…</p>');
  try { $("#mb").innerHTML = `<pre class="box" style="max-height:60vh">${esc((await api("task?id=" + encodeURIComponent(id))).report)}</pre>`; }
  catch (e) { $("#mb").innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
}

// ---------- palette (Ctrl+K): conversations, pages, commands
let palItems = [], palOn = 0;
function paletteItems(q) {
  const items = [], add = (label, hint, run) => items.push({label, hint, run});
  add("New conversation", "", newConversation);
  Object.entries(TOOLS).filter(([k]) => !hides(k)).forEach(([k, l]) => add(l, "page", () => openPage(k)));
  if (!hides("analytics") && !S?.share) Object.entries(ATABS).forEach(([k, [l, about]]) => items.push({label: `Analytics: ${l}`, hint: "analytics tab", keys: about,
    run: () => page === "analytics" && $("#apanel") ? VIEWS.analytics.pick(k) : (VIEWS.analytics.tab = k, openPage("analytics"))}));
  threadList.forEach(t => add(t.title, "conversation", () => openThread(t.id)));
  if (!hides("tasks")) add("New Agent OS task…", "tasks", () => newTask());
  add("Attach files…", "composer", () => pickFiles("files"));
  add("Attach a folder…", "composer", () => pickFiles("folder"));
  if (thread && !page) add("Wrap up this conversation", "knowledge", wrapUp);
  add("Check health", "system", () => act({do: "health"}));
  if (!hides("updates")) add("Check for updates", "system", () => act({do: "update_check"}));
  add("Unload all models", "models", () => act({do: "models.unload"}));
  add("Stop all AI (before gaming)", "system", () => confirm("Kill all AI, HyperDesk included? Nothing restarts until you open it again.") && act({do: "stop_all"}));
  ["workspace", "artifacts", "logs", "AgentOS", "images"].filter(hasFolder).forEach(f => add(`Open folder ${f}`, "folder", () => act({do: "folder.open", name: f})));
  Object.keys(S?.services || {}).forEach(n => { add(`Open ${n}`, "service", () => act({do: "service.open", name: n})); add(`Start ${n}`, "service", () => act({do: "service.start", name: n})); add(`Stop ${n}`, "service", () => act({do: "service.stop", name: n})); });
  if (!hides("projects")) cache.projects.filter(e => e.exists).forEach(e => [["claude", "Claude Code"], ["codex", "Codex"], ["terminal", "Terminal"], ["explorer", "Folder"]].forEach(([t, n]) => add(`${e.name}: open in ${n}`, "project", () => act({do: "project.open", path: e.path, tool: t}))));
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = items.filter(it => words.every(w => (it.label + " " + it.hint + " " + (it.keys || "")).toLowerCase().includes(w)));
  if (q) hits.unshift({label: `Do it: “${q}”`, hint: "new message", run: () => send(q)});
  return hits.slice(0, 60);
}
function drawPalette() {
  palItems = paletteItems($("#palq").value.trim());
  palOn = Math.min(palOn, Math.max(palItems.length - 1, 0));
  $("#pall").innerHTML = palItems.map((it, i) => `<div class="it ${i === palOn ? "on" : ""}" data-js="palpick" data-i="${i}"><span>${esc(it.label)}</span><span>${esc(it.hint)}</span></div>`).join("");
  $("#pall .it.on")?.scrollIntoView({block: "nearest"});
}
function palette() {
  if (!cache.projects.length) loadProjects().then(drawPalette).catch(() => {});
  $("#pal").classList.add("open"); $("#palq").value = ""; palOn = 0; drawPalette(); $("#palq").focus();
}
function palPick(i) { const it = palItems[i]; $("#pal").classList.remove("open"); if (it && narrow()) fold(true, false); it?.run(); }
$("#palq").addEventListener("input", () => { palOn = 0; drawPalette(); });
$("#palq").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); palOn = (palOn + (e.key === "ArrowDown" ? 1 : -1) + palItems.length) % Math.max(palItems.length, 1); drawPalette(); }
  else if (e.key === "Enter") { e.preventDefault(); palPick(palOn); }
});

// ---------- wiring: every [data-page], [data-do] and [data-js] element
const narrow = () => matchMedia("(max-width: 820px)").matches;  // the sidebar is an overlay there (CSS, same width)
function fold(on, remember = true) {
  const folded = on ?? !document.body.classList.contains("folded");
  document.body.classList.toggle("folded", folded);
  $("#unfold").hidden = !folded;
  if (remember) try { localStorage.setItem("folded", folded ? "1" : ""); } catch {}
}
const JS = {
  startmode: d => { JS.pickwhere({v: d.v, l: {auto: 'Auto', team: 'Local team', gemini: 'Gemini', improve: 'Improve HyperDesk'}[d.v]}); ask.placeholder = d.v === 'improve' ? 'Describe what you want to change in HyperDesk…' : 'What would you like done?'; },
  geminisave: async () => { if (await act({do: 'gemini.save', model: $('#geminimodel').value, key: $('#geminikey').value})) { $('#geminikey').value = ''; toast('Saved. Choose Gemini in the message box.'); } },
  fold: () => fold(), new: newConversation, palette, send: () => send(), status: (d, el) => statusMenu(el), wheremenu: (d, el) => whereMenu(el),
  pickwhere: d => { prefer = d.v; $("#wherelabel").textContent = d.l; ask.placeholder = d.v === 'improve' ? 'Describe what you want to change in HyperDesk…' : 'What would you like done?'; $("#fine").textContent = d.v === 'improve' ? 'Your current version is saved first. Free and local AI build and test the change, with no paid AI; you click Apply update when it is ready.' : 'Choose Auto for everyday requests, Local team for a second opinion, or Improve HyperDesk to change the app.'; closeMenu(); preview(); ask.focus(); },
  usemodel: d => { prefer = "model:" + d.name; $("#wherelabel").textContent = d.name; newConversation(); },
  fullscreen: () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(),
  openthread: d => openThread(d.id),
  delthread: async d => { if (!confirm("Delete this conversation? Its entries and any files dropped into it go; pictures, repos and your own files stay.")) return; if (await act({do: "thread.delete", id: d.id}, true)) { if (d.id === thread) newConversation(); else loadThreads(); } },
  example: d => send(d.q), mic: toggleMic, close: closeModal,
  jobcancel: d => act({do: "job.cancel", id: d.id}, true).then(() => loadThread()),
  again: d => act({do: "job.again", id: d.id, thread, prefer: d.prefer}, true).then(() => loadThread(true)),
  copy: d => navigator.clipboard.writeText(jobs.find(j => j.id === d.id)?.output || "").then(() => toast("Copied")),
  copytext: d => navigator.clipboard.writeText(d.text).then(() => toast("Copied")),
  inspect: d => inspect(d.id), task: d => newTask("", d.repo), taskrun: runTask,
  zoom: d => modal(d.name, `<img alt="" style="max-width:100%;border-radius:4px;display:block" src="/api/image/file?name=${encodeURIComponent(d.name)}&t=${T}">`, `${btn("Open folder", {do: "folder.open", name: "images"}, "btn quiet")}${btn("Close", {js: "close"})}`),
  approve: d => { $("#approve").classList.remove("open"); act({do: "approval", id: d.id, allow: d.allow === "yes"}); },
  showapproval: () => { shownApproval = ""; renderApproval(); },
  pfilter: d => { VIEWS.projects.filter = d.f; VIEWS.projects.render(); },
  prefresh: async () => { await loadProjects(true).catch(e => toast(e.message, true)); VIEWS.projects.list(); },
  trefresh: () => VIEWS.tasks.render(), irefresh: () => VIEWS.images.gallery(), urefresh: () => { $("#ulist").innerHTML = '<p class="muted">Counting…</p>'; VIEWS.activity.usage(true); },
  uset: d => { VIEWS.activity[d.f] = d.v; VIEWS.activity.draw(); },
  tkind: d => { VIEWS.activity.kind = d.k; document.querySelectorAll('[data-js="tkind"]').forEach(b => b.classList.toggle("on", b.dataset.k === d.k)); VIEWS.activity.feed(); },
  generate, isize: d => { VIEWS.images.form.size = d.k; document.querySelectorAll('[data-js="isize"]').forEach(b => b.classList.toggle("on", b.dataset.k === d.k)); },
  iview: d => { const g = (VIEWS.images.items || []).find(x => x.name === d.name); if (g) modal(g.name, `<img alt="" style="max-width:100%;border-radius:4px;display:block" src="/api/image/file?name=${encodeURIComponent(g.name)}&t=${T}">${g.prompt ? `<p class="small muted">${esc(g.prompt)}</p>` : ""}`, `${g.prompt ? btn("Use this prompt", {js: "iuse", prompt: g.prompt}, "btn quiet") : ""}${btn("Close", {js: "close"})}`); },
  iuse: d => { closeModal(); Object.assign(VIEWS.images.form, {prompt: d.prompt, open: true}); VIEWS.images.render(); },
  palpick: d => palPick(+d.i),
  vpick: async () => {
    const r = await api("pick", {kind: "files"}).catch(e => (toast(e.message, true), null));
    if (r?.refused.length) toast("That file is off limits", true);
    if (r?.paths[0]) { VIEWS.video.form.path = r.paths[0]; $("#vpath").textContent = r.paths[0]; VIEWS.video.fields(); }
  },
  tpick: () => $("#tfile")?.click(),
  atoggle: async d => { if (await act({do: "analytics.toggle", on: d.on})) VIEWS.analytics.render(); },
  smtoggle: async d => { if (await act({do: "sites.toggle", on: d.on})) VIEWS.sites.render(); },
  smadd: async () => {
    const url = $("#smurl").value.trim();
    if (!url) return toast("Type a website address first", true);
    if (await act({do: "sites.add", url, name: $("#smname").value})) VIEWS.sites.render();
  },
  atab: d => VIEWS.analytics.pick(d.tab),
  aframetop: () => VIEWS.analytics.pick("videos", 0),
  aretry: () => VIEWS.analytics.loadVideos(),
  awindow: d => { const v = VIEWS.analytics; v.days = +d.days; document.querySelectorAll('[data-js="awindow"]').forEach(b => { b.classList.toggle("on", +b.dataset.days === v.days); b.setAttribute("aria-pressed", String(+b.dataset.days === v.days)); }); v.loadVideos(); },
  amore: () => { VIEWS.analytics.limit += 25; VIEWS.analytics.drawVideos(); },
  vset: d => { VIEWS.video.form[d.k] = d.v; document.querySelectorAll(`[data-js="vset"][data-k="${d.k}"]`).forEach(b => { b.classList.toggle("on", b.dataset.v === d.v); b.setAttribute("aria-pressed", String(b.dataset.v === d.v)); }); VIEWS.video.fields(); },
  vgo: async () => {
    const f = VIEWS.video.form;
    f.seconds = +$("#vsec").value || 59; f.fresh = $("#vfresh").checked; f.directions = $("#vdir").value;
    if (!f.path) return toast("Pick a video first", true);
    if (await act({do: "video.edit", path: f.path, cut: f.cut, for: f.for, frame: f.frame, directions: f.cut === "clean" ? f.directions : "", seconds: String(f.seconds), fresh: f.fresh})) VIEWS.video.render();
  },
  attachmenu: (d, el) => attachMenu(el), pick: d => pickFiles(d.k), pickopen: d => pickOpen(d.tool),
  unattach: d => { attached = attached.filter(p => p !== d.p); renderAtt(); ask.focus(); },
  wrapup: () => { wrapUp(); }, wrapsave: saveWrap,  // wrapup: no promise, so a cancelled draft never holds the button
  knote: d => noteForm(d.kind, d.name), knotesave: saveNote,
  ksave: async () => {
    const v = VIEWS.knowledge, t = $("#kctx").value;
    if (v.saved == null) return toast("Your context did not load. Open Knowledge again before saving.", true);
    if (await act({do: "knowledge.save", kind: "context", text: t})) v.saved = t;
  },
  ktidy: async () => {  // the draft is made from the saved file, so it must not replace unsaved typing
    const box = $("#kctx"), was = box.value;
    if (was !== VIEWS.knowledge.saved) return toast("Save first: Tidy shortens the saved context.", true);
    $("#ktidy").textContent = "fast is drafting a shorter version…";
    try {
      const r = await api("tidy", {});
      if (!box.isConnected) return;  // Ben left the page meanwhile
      if (box.value !== was) { $("#ktidy").textContent = ""; return toast("You edited while it drafted, so the draft was not put in.", true); }
      box.value = r.text; $("#ktidy").textContent = `Draft: ${r.before} → ${r.after} characters. Check it, then Save (or leave the page to keep the old one).`;
    } catch (e) { if ($("#ktidy")) $("#ktidy").textContent = ""; toast(e.message, true); }
  },
  freekey: async () => { if (await act({do: "free.key", key: $("#freekey").value})) $("#freekey").value = ""; },
  kdel: async d => { if (confirm(`Delete ${d.name}?`) && await act({do: "knowledge.delete", kind: d.kind, name: d.name})) VIEWS.knowledge.refresh(); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-page], [data-do], [data-js]");
  if (!el || el.disabled) { if (!e.target.closest("#menu")) closeMenu(); return; }
  if (el._busy) return;  // its last click is still on its way: a double-click must not ask Claude, run a task or save twice
  if (!["status", "wheremenu", "attachmenu"].includes(el.dataset.js)) closeMenu();  // every other click closes an open menu
  if (el.closest("#modal") && el.dataset.page) closeModal();
  // a narrow window's sidebar lies over the page: going anywhere closes it (not remembered for a wide window)
  if ((el.dataset.page !== undefined || ["new", "openthread", "palette"].includes(el.dataset.js)) && narrow()) fold(true, false);
  if (el.dataset.page === "analytics" && el.dataset.tab) VIEWS.analytics.tab = el.dataset.tab;
  if (el.dataset.page !== undefined) return el.dataset.page in TOOLS && !hides(el.dataset.page) ? openPage(el.dataset.page) : null;  // a digest line can name a page the lite build hides
  let run;
  if (el.dataset.js) run = JS[el.dataset.js](el.dataset, el);
  else { const {confirm: q, ...payload} = el.dataset; if (!q || confirm(q)) run = act(payload); }
  if (run?.finally) { el._busy = true; run.finally(() => { el._busy = false; }).catch(() => {}); }
});
// on the press, not the click: a text selection dragged out of the dialog ends on the backdrop and must not close it
for (const id of ["#pal", "#modal"]) $(id).addEventListener("mousedown", e => { if (e.target.id === id.slice(1)) $(id).classList.remove("open"); });
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (e.ctrlKey && k === "k") { e.preventDefault(); palette(); }
  else if (e.ctrlKey && e.shiftKey && k === "o") { e.preventDefault(); newConversation(); }
  else if (e.key === "Escape") { closeMenu(); $("#pal").classList.remove("open"); if ($("#modal").classList.contains("open")) closeModal(); }  // closeModal stops the mic: only for a dialog
});
addEventListener("resize", closeMenu);
addEventListener("message", e => {  // the sandboxed website dashboard: its height, its theme pick (it has no storage of its own), a tab click
  const f = $("#smdash"), d = e.data;
  if (!f || e.source !== f.contentWindow || !d || page !== "sites") return;
  if (Number.isFinite(d.smHeight)) f.style.height = (VIEWS.sites.fh = Math.min(Math.max(d.smHeight, 0) + 8, 20000)) + "px";
  if (typeof d.smSkin === "string" && /^[a-z]{1,20}$/.test(d.smSkin)) try { localStorage.setItem("smskin:" + VIEWS.sites.site, d.smSkin); } catch {}
  const s = $("#scroll"), by = s ? f.getBoundingClientRect().top - s.getBoundingClientRect().top : 0;
  if (d.smTab && by < 0) s.scrollBy(0, by - 8);  // a tab clicked far down the frame: bring its top back into view
});
addEventListener("message", e => {  // the sandboxed Analytics dashboard: its height (so the frame needs no scrollbar), a tab to open, a spot to scroll to
  const f = $("#adash"), d = e.data;
  if (!f || e.source !== f.contentWindow || !d || page !== "analytics") return;
  if (Number.isFinite(d.sdaHeight)) f.style.height = (VIEWS.analytics.fh = Math.min(Math.max(d.sdaHeight, 0) + 8, 20000)) + "px";
  if (typeof d.sdaGo === "string" && Object.hasOwn(ATABS, d.sdaGo)) { VIEWS.analytics.pick(d.sdaGo); $("#atab-" + d.sdaGo)?.focus(); }
  if (d.sdaKey === "palette") palette();
  if (Number.isFinite(d.sdaScroll) && !f.hidden) VIEWS.analytics.pick(VIEWS.analytics.tab, Math.max(0, d.sdaScroll));
});

try { if (localStorage.getItem("folded")) fold(true); } catch {}
newConversation();
poll();
setInterval(poll, 4000);
